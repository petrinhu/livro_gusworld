# Portoes de sigilo do livro (SG-02), sem chave. O job julga o HEAD pelo portao da base (commit anterior),
# extraido do proprio repositorio, e roda o gitleaks. Nenhum segredo de cifra entra aqui; o log publico
# mostra so caminho, hash e contagem.
name: sigilo

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Portoes sem chave, julgados pelo portao da base
        shell: sh
        env:
          BASE_PUSH: ${{ github.event.before }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          BASE_PADRAO: ${{ github.event.repository.default_branch }}
          BOOTSTRAP_BLOB: 1283099e74cbe46d55116e5951ed5eb4fa305cf9
          GIT_NO_REPLACE_OBJECTS: "1"
        run: |
          # inicio-verificacao (SG-02): nada do checkout roda antes desta conferencia
          git rev-parse -q --verify HEAD >/dev/null || { echo "  FALHOU historico vazio: sem HEAD"; exit 1; }
          b=$(git rev-parse -q --verify HEAD:ferramentas/portoes/ci-bootstrap.sh) || { echo "  FALHOU HEAD sem ci-bootstrap.sh"; exit 1; }
          [ "$b" = "$BOOTSTRAP_BLOB" ] || { echo "  FALHOU ci-bootstrap.sh fora do hash fixado no workflow: $b"; exit 1; }
          d=$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/var/tmp}}/boot.XXXXXX") || exit 1
          git cat-file blob "$BOOTSTRAP_BLOB" > "$d/ci-bootstrap.sh" || exit 1
          sh "$d/ci-bootstrap.sh"
          # fim-verificacao
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
